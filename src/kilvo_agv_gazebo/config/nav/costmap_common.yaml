# ===== THÔNG SỐ CHUNG CHO CẢ 2 COSTMAP (toàn cục + cục bộ) =====
# Thân AGV 0.8 x 0.6 m, tâm tại base_link
footprint: [[0.42, 0.32], [0.42, -0.32], [-0.42, -0.32], [-0.42, 0.32]]
footprint_padding: 0.02

# Lớp vật cản: từ LiDAR 3D, để tránh vật không có trong bản đồ (người, pallet mới)
obstacle_layer:
  enabled: true
  observation_sources: lidar
  combination_method: 1
  lidar:
    topic: /lidar/points
    data_type: PointCloud2
    marking: true
    clearing: true
    # độ cao tính trong khung map (= camera_init, sàn ở z ~ -0.17): chỉ lấy vật cao 0.1..1.0 m so với sàn
    min_obstacle_height: -0.07
    max_obstacle_height: 0.85
    obstacle_range: 6.0
    raytrace_range: 8.0
    inf_is_valid: false

# Lớp phồng: giữ robot cách xa vật cản
inflation_layer:
  enabled: true
  inflation_radius: 0.6
  cost_scaling_factor: 4.0
